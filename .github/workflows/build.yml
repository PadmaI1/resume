name: Build resume PDF

on:
  push:
    branches: [main]
    paths: ["**.tex", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Padma_Iyer_Resume.tex

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Padma_Iyer_Resume.pdf
          git diff --cached --quiet || git commit -m "Build resume PDF"
          git push
